# The Witcher 3: Wild Hunt (292030)
# REDlauncher's Qt WebEngine GPU process hits a breakpoint (0x80000003) after "Unable to create pbuffer" under Wine.
# REDprelauncher honours --launcher-skip and starts bin\x64_dx12\witcher3.exe directly.
ARGS=--launcher-skip
# 5.0 skips NVIDIA Streamline (no DLSS) once GetProcAddress(ntdll, "wine_get_version") answers.
HIDE_WINE_EXPORTS=1
